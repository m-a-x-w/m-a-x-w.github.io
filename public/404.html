<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var redirect =
      location.pathname + location.search + location.hash;
    location.replace('/?redirect=' + encodeURIComponent(redirect));
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
